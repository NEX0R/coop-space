# Ogni modifica viene verificata con il validatore ufficiale Mojang.
# - Su una pull request: verifica + file .mcaddon allegato alla build, e anteprima scaricabile dal
#   telefono nella pre-release "anteprima-pr-<numero>" (la cancella anteprime.yml quando la PR si chiude).
# - Su main: verifica + pubblicazione del .mcaddon nella release "ultima-versione",
#   scaricabile da telefono dalla pagina Releases del repository.
name: Build add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controlla che la storia sia quella del progetto
        # Il 26/11 la storia è stata riscritta per togliere i nomi veri. Una cartella scaricata prima,
        # o un'unione con --allow-unrelated-histories, riporterebbe i commit vecchi: qui si fermano.
        run: |
          RADICI=$(git rev-list --max-parents=0 HEAD)
          if [ "$RADICI" != "29298af7dd495158eea5c09227728b6063f26609" ]; then
            echo "::error::Questa modifica contiene una storia diversa da quella del progetto (forse la vecchia, prima del 26/11). Riscarica il progetto da capo con git clone e rifai la modifica lì: vedi AGENTS.md, 'Storia riscritta'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa gli strumenti
        run: npm ci

      - name: Verifica e crea il .mcaddon
        env:
          # Nelle anteprime il nome del pacchetto in Minecraft diventa "Coop Space BP <versione> (anteprima PR #N)".
          # Tra virgolette: in YAML " #" senza virgolette inizierebbe un commento e romperebbe l'espressione.
          COOP_ETICHETTA: "${{ github.event_name == 'pull_request' && format('anteprima PR #{0}', github.event.pull_request.number) || '' }}"
        run: npm run package

      - name: Prova sul server ufficiale Bedrock
        # Parte solo se il proprietario del repository ha accettato l'EULA di Minecraft anche per GitHub,
        # creando lui la variabile EULA_MINECRAFT_ACCETTATA = true
        # (Settings → Secrets and variables → Actions → Variables). Vedi AGENTS.md.
        # Codice 1: l'add-on ha problemi e la build fallisce. Codice 3: la prova non è potuta partire
        # (per esempio il sito di Minecraft non risponde): resta un avviso e la build continua.
        if: vars.EULA_MINECRAFT_ACCETTATA == 'true'
        env:
          MCTOOLS_I_ACCEPT_EULA_AT_MINECRAFTDOTNETSLASHEULA: ${{ vars.EULA_MINECRAFT_ACCETTATA }}
        run: |
          set +e
          node scripts/prova-server.mjs
          CODICE=$?
          if [ "$CODICE" -eq 3 ]; then
            echo "::warning::La prova sul server Bedrock non è partita: guarda il riepilogo della build."
            exit 0
          fi
          exit "$CODICE"

      - name: Allega il .mcaddon alla build
        uses: actions/upload-artifact@v4
        with:
          name: coop-space-mcaddon
          path: dist/coop-space.mcaddon

      - name: Pubblica l'anteprima per il telefono
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="anteprima-pr-$NUMERO"
          # Anteprima solo se la pull request cambia il gioco (addon/): per documenti e strumenti non serve e confonde.
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMERO/files" --paginate --jq '.[].filename' | grep -q '^addon/'; then
            echo "Questa pull request non cambia addon/: nessuna anteprima." >> "$GITHUB_STEP_SUMMARY"
            gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
            exit 0
          fi
          VERSIONE=$(node -e "const fs=require('fs'),p='out/pacchetto/behavior_packs/';const d=fs.readdirSync(p)[0];console.log(JSON.parse(fs.readFileSync(p+d+'/manifest.json','utf8')).header.version.join('.'))")
          NOTE="Anteprima della pull request #$NUMERO, versione $VERSIONE (commit ${COMMIT::7}). Per provarla: scarica coop-space-mondo-prova.mcworld (mondo già pronto, add-on attivo) oppure coop-space.mcaddon (poi attiva \"Coop Space\" nei Pacchetti comportamento di un mondo nuovo), e aprilo con Minecraft chiuso. Si cancella da sola quando la pull request viene chiusa."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/coop-space.mcaddon dist/coop-space-mondo-prova.mcworld --clobber
            gh release edit "$TAG" --title "Anteprima PR #$NUMERO ($VERSIONE)" --notes "$NOTE"
          else
            gh release create "$TAG" dist/coop-space.mcaddon dist/coop-space-mondo-prova.mcworld --prerelease --target "$COMMIT" --title "Anteprima PR #$NUMERO ($VERSIONE)" --notes "$NOTE"
          fi
          echo "Anteprima $VERSIONE: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/coop-space.mcaddon" >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica in "ultima-versione"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La release viene ricreata a ogni modifica su main: così in cima alla pagina Releases c'è sempre,
          # con la data e la versione vere. Il link di download resta lo stesso.
          VERSIONE=$(node -e "const fs=require('fs'),p='out/pacchetto/behavior_packs/';const d=fs.readdirSync(p)[0];console.log(JSON.parse(fs.readFileSync(p+d+'/manifest.json','utf8')).header.version.join('.'))")
          NOTE="Versione $VERSIONE del $(date -u '+%d/%m/%Y alle %H:%M') UTC (commit ${GITHUB_SHA::7}). Per provare: coop-space-mondo-prova.mcworld è un mondo già pronto con l'add-on attivo. Per i tuoi mondi: coop-space.mcaddon, poi attiva \"Coop Space\" nei Pacchetti comportamento. Apri i file con Minecraft chiuso."
          gh release delete ultima-versione --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create ultima-versione dist/coop-space.mcaddon dist/coop-space-mondo-prova.mcworld --title "Ultima versione $VERSIONE" --notes "$NOTE" --latest --target "$GITHUB_SHA"
          echo "Ultima versione $VERSIONE pubblicata." >> "$GITHUB_STEP_SUMMARY"
          # Copia di riserva di ogni versione (chiesta da Nexor il 27/11): "ultima-versione" viene ricreata a ogni
          # fusione, invece "versione-<numero>" resta per sempre. Così si può riscaricare qualsiasi versione vecchia.
          gh release create "versione-$VERSIONE" dist/coop-space.mcaddon dist/coop-space-mondo-prova.mcworld --title "Versione $VERSIONE (copia di riserva)" --notes "Copia di riserva, non cancellare. $NOTE" --latest=false --target "$GITHUB_SHA"             && echo "Copia di riserva: versione-$VERSIONE." >> "$GITHUB_STEP_SUMMARY"             || echo "Copia di riserva versione-$VERSIONE NON creata." >> "$GITHUB_STEP_SUMMARY"
