# Ogni modifica viene verificata con il validatore ufficiale Mojang.
# - Su una pull request: verifica + file .mcaddon allegato alla build, e anteprima scaricabile dal
#   telefono nella pre-release "anteprima-pr-<numero>" (la cancella anteprime.yml quando la PR si chiude).
# - Su main: verifica + pubblicazione del .mcaddon nella release "ultima-versione",
#   scaricabile da telefono dalla pagina Releases del repository.
name: Build add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa gli strumenti
        run: npm ci

      - name: Verifica e crea il .mcaddon
        run: npm run package

      - name: Allega il .mcaddon alla build
        uses: actions/upload-artifact@v4
        with:
          name: coop-space-mcaddon
          path: dist/coop-space.mcaddon

      - name: Pubblica l'anteprima per il telefono
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="anteprima-pr-$NUMERO"
          NOTE="Anteprima della pull request #$NUMERO (commit ${COMMIT::7}). Per provarla: scarica coop-space.mcaddon dal telefono e aprilo con Minecraft chiuso, poi usa un mondo nuovo. Si cancella da sola quando la pull request viene chiusa."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/coop-space.mcaddon --clobber
            gh release edit "$TAG" --notes "$NOTE"
          else
            gh release create "$TAG" dist/coop-space.mcaddon --prerelease --target "$COMMIT" --title "Anteprima PR #$NUMERO" --notes "$NOTE"
          fi
          echo "Anteprima: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/coop-space.mcaddon" >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica in "ultima-versione"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Versione automatica del commit ${GITHUB_SHA::7}. Scarica coop-space.mcaddon sul telefono e aprilo con Minecraft."
          if gh release view ultima-versione >/dev/null 2>&1; then
            gh release upload ultima-versione dist/coop-space.mcaddon --clobber
            gh release edit ultima-versione --notes "$NOTE"
          else
            gh release create ultima-versione dist/coop-space.mcaddon --title "Ultima versione" --notes "$NOTE" --latest
          fi
